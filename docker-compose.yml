
services:
  database:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - app-network
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: ghcr.io/osama2771997-devops/three-tier-app/backend:${BUILD_NUMBER}
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - database
    env_file:
      - ./backend/.env
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"
    read_only: true
    networks:
      - app-network

  frontend:
    image: ghcr.io/osama2771997-devops/three-tier-app/frontend:${BUILD_NUMBER}
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"
    read_only: true
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
